name: Deploy Backend to EC2

# Fires automatically whenever backend/ changes on main, so a normal
# `git push origin main` is all it takes to redeploy the FastAPI backend.
# Can also be triggered manually from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: career-path-backend
  CONTAINER_NAME: career-path-backend
  REMOTE_DEPLOY_DIR: /home/ubuntu/deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest -f backend/Dockerfile backend

      - name: Save image to a compressed tarball
        run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > ${{ env.IMAGE_NAME }}.tar.gz

      - name: Show image size
        run: ls -lh ${{ env.IMAGE_NAME }}.tar.gz

      - name: Ensure remote deploy directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ${{ env.REMOTE_DEPLOY_DIR }}

      - name: Copy image tarball to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "${{ env.IMAGE_NAME }}.tar.gz"
          target: "${{ env.REMOTE_DEPLOY_DIR }}"

      - name: Load image and restart container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="${{ env.REMOTE_DEPLOY_DIR }}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Locate the uploaded archive
            TAR_GZ=$(find "$DEPLOY_DIR" "$HOME" -maxdepth 2 -name "${{ env.IMAGE_NAME }}.tar.gz" 2>/dev/null | head -n 1)

            if [ -n "$TAR_GZ" ] && [ -f "$TAR_GZ" ]; then
              echo "Loading Docker image from $TAR_GZ..."
              gzip -dc "$TAR_GZ" | docker load
              rm -f "$TAR_GZ"
            elif [ -f "${{ env.IMAGE_NAME }}.tar" ]; then
              echo "Loading Docker image from ${{ env.IMAGE_NAME }}.tar..."
              docker load -i "${{ env.IMAGE_NAME }}.tar"
              rm -f "${{ env.IMAGE_NAME }}.tar"
            else
              echo "ERROR: Could not find ${{ env.IMAGE_NAME }}.tar.gz in $DEPLOY_DIR or $HOME"
              ls -la "$DEPLOY_DIR" || true
              exit 1
            fi

            # Locate env file safely
            ENV_FILE=""
            if [ -f "$HOME/app/.env" ]; then
              ENV_FILE="$HOME/app/.env"
            elif [ -f "/home/ubuntu/app/.env" ]; then
              ENV_FILE="/home/ubuntu/app/.env"
            elif [ -f "$HOME/.env" ]; then
              ENV_FILE="$HOME/.env"
            fi

            echo "Stopping previous container if running..."
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            echo "Starting new container..."
            if [ -n "$ENV_FILE" ] && [ -f "$ENV_FILE" ]; then
              echo "Using env file: $ENV_FILE"
              docker run -d \
                --name ${{ env.CONTAINER_NAME }} \
                --restart unless-stopped \
                -p 80:8000 \
                --env-file "$ENV_FILE" \
                ${{ env.IMAGE_NAME }}:latest
            else
              echo "Starting container without external env-file"
              docker run -d \
                --name ${{ env.CONTAINER_NAME }} \
                --restart unless-stopped \
                -p 80:8000 \
                ${{ env.IMAGE_NAME }}:latest
            fi

            docker image prune -f

      - name: Verify /health on the deployed instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            for i in $(seq 1 20); do
              if curl -sf http://localhost/health || curl -sf http://127.0.0.1:8000/health; then
                echo "Healthy after ${i} attempt(s)"
                exit 0
              fi
              echo "Not ready yet (attempt ${i}/20), waiting 5s..."
              sleep 5
            done
            echo "Container never became healthy - dumping logs:"
            docker logs --tail 150 ${{ env.CONTAINER_NAME }}
            exit 1

