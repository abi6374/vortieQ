name: Deploy Backend to EC2

# Fires automatically whenever backend/ changes on main, so a normal
# `git push origin main` is all it takes to redeploy the FastAPI backend.
# Can also be triggered manually from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: career-path-backend
  CONTAINER_NAME: career-path-backend
  REMOTE_DEPLOY_DIR: /home/ubuntu/deploy
  # Sourced from a GitHub repo secret (Settings -> Secrets and variables ->
  # Actions -> YOUTUBE_API_KEY), never committed and never visible in logs
  # (GitHub automatically masks any value pulled from `secrets.*`). Empty
  # string if the secret hasn't been added yet - the sync step below is a
  # no-op in that case, so this workflow keeps working for anyone who
  # hasn't set it up.
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest -f backend/Dockerfile backend

      - name: Save image to a compressed tarball
        run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > ${{ env.IMAGE_NAME }}.tar.gz

      - name: Show image size
        run: ls -lh ${{ env.IMAGE_NAME }}.tar.gz

      - name: Ensure remote deploy directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ${{ env.REMOTE_DEPLOY_DIR }}

      - name: Copy image tarball to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "${{ env.IMAGE_NAME }}.tar.gz"
          target: "${{ env.REMOTE_DEPLOY_DIR }}"

      # Runs BEFORE the container restart below, so the freshly-synced .env
      # is already in place when `docker run --env-file` reads it. Neither
      # the workflow log nor the remote script ever echoes the secret value
      # itself - only whether an entry was added/updated, and GitHub masks
      # `secrets.*` values in logs regardless (defense in depth, not relied
      # on alone). No-op (via `if:`) until YOUTUBE_API_KEY is added as a
      # repo secret, so this doesn't break deploys for anyone who hasn't
      # set it up yet, and no-op safely if the remote .env doesn't exist
      # yet either (never fabricates one from nothing - the existing three
      # Supabase/Groq secrets still have to be set up manually the first
      # time, same as before this change).
      - name: Sync YOUTUBE_API_KEY into the remote .env (idempotent)
        if: ${{ env.YOUTUBE_API_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          YOUTUBE_API_KEY: ${{ env.YOUTUBE_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: YOUTUBE_API_KEY
          script: |
            set -e
            ENV_FILE=""
            for f in "$HOME/app/.env" "/home/ubuntu/app/.env" "$HOME/.env"; do
              if [ -f "$f" ]; then
                ENV_FILE="$f"
                break
              fi
            done
            if [ -z "$ENV_FILE" ]; then
              echo "No existing .env file found on host (checked ~/app/.env, /home/ubuntu/app/.env, ~/.env) - cannot sync YOUTUBE_API_KEY. Create the .env file with the existing required secrets first."
              exit 1
            fi
            if grep -q '^YOUTUBE_API_KEY=' "$ENV_FILE"; then
              sed -i "s|^YOUTUBE_API_KEY=.*|YOUTUBE_API_KEY=${YOUTUBE_API_KEY}|" "$ENV_FILE"
              echo "Updated existing YOUTUBE_API_KEY entry in $ENV_FILE"
            else
              echo "YOUTUBE_API_KEY=${YOUTUBE_API_KEY}" >> "$ENV_FILE"
              echo "Added YOUTUBE_API_KEY entry to $ENV_FILE"
            fi

      - name: Load image and restart container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="${{ env.REMOTE_DEPLOY_DIR }}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Locate the uploaded archive
            TAR_GZ=$(find "$DEPLOY_DIR" "$HOME" -maxdepth 2 -name "${{ env.IMAGE_NAME }}.tar.gz" 2>/dev/null | head -n 1)

            if [ -n "$TAR_GZ" ] && [ -f "$TAR_GZ" ]; then
              echo "Loading Docker image from $TAR_GZ..."
              gzip -dc "$TAR_GZ" | docker load
              rm -f "$TAR_GZ"
            elif [ -f "${{ env.IMAGE_NAME }}.tar" ]; then
              echo "Loading Docker image from ${{ env.IMAGE_NAME }}.tar..."
              docker load -i "${{ env.IMAGE_NAME }}.tar"
              rm -f "${{ env.IMAGE_NAME }}.tar"
            else
              echo "ERROR: Could not find ${{ env.IMAGE_NAME }}.tar.gz in $DEPLOY_DIR or $HOME"
              ls -la "$DEPLOY_DIR" || true
              exit 1
            fi

            # Locate env file safely
            ENV_FILE=""
            if [ -f "$HOME/app/.env" ]; then
              ENV_FILE="$HOME/app/.env"
            elif [ -f "/home/ubuntu/app/.env" ]; then
              ENV_FILE="/home/ubuntu/app/.env"
            elif [ -f "$HOME/.env" ]; then
              ENV_FILE="$HOME/.env"
            fi

            echo "Stopping previous container if running..."
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            echo "Starting new container..."
            if [ -n "$ENV_FILE" ] && [ -f "$ENV_FILE" ]; then
              echo "Using env file: $ENV_FILE"
              docker run -d \
                --name ${{ env.CONTAINER_NAME }} \
                --restart unless-stopped \
                -p 80:8000 \
                --env-file "$ENV_FILE" \
                ${{ env.IMAGE_NAME }}:latest
            else
              echo "Starting container without external env-file"
              docker run -d \
                --name ${{ env.CONTAINER_NAME }} \
                --restart unless-stopped \
                -p 80:8000 \
                ${{ env.IMAGE_NAME }}:latest
            fi

            docker image prune -f

      - name: Verify /health on the deployed instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            for i in $(seq 1 20); do
              if curl -sf http://localhost/health || curl -sf http://127.0.0.1:8000/health; then
                echo "Healthy after ${i} attempt(s)"
                exit 0
              fi
              echo "Not ready yet (attempt ${i}/20), waiting 5s..."
              sleep 5
            done
            echo "Container never became healthy - dumping logs:"
            docker logs --tail 150 ${{ env.CONTAINER_NAME }}
            exit 1

